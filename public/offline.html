<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0d4a38" />
    <title>Garderie Oasis - Offline</title>
    <style>
      body {
        margin: 0;
        background: #fbf7ee;
        color: #0d4a38;
        font:
          16px/1.6 system-ui,
          sans-serif;
      }
      .card {
        width: min(560px, calc(100% - 40px));
        margin: 12vh auto;
        border: 1px solid #dedbd1;
        border-radius: 24px;
        background: #fffdf8;
        padding: 38px;
        box-shadow: 0 20px 60px #0d4a3822;
      }
      h1 {
        font:
          600 2.5rem/1.1 Georgia,
          serif;
      }
      a {
        display: inline-block;
        border-radius: 9px;
        background: #0d4a38;
        padding: 12px 18px;
        color: white;
        text-decoration: none;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <p>Garderie Oasis Digital Experience</p>
      <h1>You are offline.</h1>
      <p>
        The public demonstration needs a connection for this page. Tour submissions, sign-in,
        director routes, and APIs are never cached.
      </p>
      <a href="/">Try the home page</a>
    </main>
  </body>
</html>
